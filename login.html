<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FINVORA — Premium Investment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030508;
            --bg-navy: #050a14;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #B8860B 0%, #D4AF37 50%, #FFD700 100%);
            --text-white: #ffffff;
            --text-gray: #a0aec0;
            --glass-border: rgba(212, 175, 55, 0.2);
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top left, #001a33, transparent);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-navy);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-area a {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--gold-primary);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 15px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Password Toggle Styling */
        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-gray);
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .btn-login {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-login:hover { transform: translateY(-1px); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .footer-links a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .support-link {
            display: block;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        #message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.2);
            display: block !important;
        }

        .msg-success {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--glass-border);
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="auth-card" id="loginCard">
        <div class="logo-area">
            <a href="index.html">FINVORA</a>
            <p style="font-size: 0.85rem; color: var(--text-gray); margin-top: 10px;">Welcome back</p>
        </div>

        <div id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="toggleBtn" title="Toggle visibility">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Login</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="register.html">Create Account</a>
            <a href="support.html" class="support-link">Need help? Contact Support</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './src/lib/supabase.js';
        import { auth } from './src/lib/auth.js';

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('message');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggleBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        // 1. Session Pre-check
        window.addEventListener('DOMContentLoaded', async () => {
            const session = await auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        // 2. Password Toggle Logic
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Change icon opacity to indicate state
            eyeIcon.style.opacity = type === 'text' ? '1' : '0.5';
            eyeIcon.style.color = type === 'text' ? 'var(--gold-primary)' : 'var(--text-gray)';
        });

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = type === 'error' ? 'msg-error' : 'msg-success';
        }

        // 3. Login Flow
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                return showMessage("Please enter your credentials.", "error");
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Verifying...";
            messageBox.style.display = 'none';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password,
                });

                if (error) {
                    // Map common Supabase errors to user-friendly messages
                    let userFriendlyMsg = error.message;
                    if (error.message === 'Invalid login credentials') {
                        userFriendlyMsg = 'Incorrect email or password.';
                    }
                    throw new Error(userFriendlyMsg);
                }

                if (data.session) {
                    showMessage("Login successful! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }

            } catch (err) {
                showMessage(err.message, "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Login";
            }
        });
    </script>
</body>
</html>
