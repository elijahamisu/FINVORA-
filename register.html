<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FINVORA — Premium Investment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030508;
            --bg-navy: #050a14;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #B8860B 0%, #D4AF37 50%, #FFD700 100%);
            --text-white: #ffffff;
            --text-gray: #a0aec0;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.2);
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #001a33, transparent);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--bg-navy);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area a {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold-primary);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 15px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin: 20px 0;
        }

        .checkbox-group a {
            color: var(--gold-primary);
            text-decoration: none;
        }

        .btn-register {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .footer-text a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
        }

        #message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.2);
            display: block !important;
        }

        .msg-success {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--glass-border);
            display: block !important;
        }

        .msg-warning {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-primary);
            border: 1px solid var(--glass-border);
            display: block !important;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-area">
            <a href="index.html">FINVORA</a>
            <p style="font-size: 0.75rem; color: var(--text-gray); letter-spacing: 1px; margin-top: 5px;">CREATE ACCOUNT</p>
        </div>

        <div id="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="08012345678" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <input type="text" id="referralCode" class="form-control" placeholder="ABC123">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the FINVORA <a href="terms.html">Terms & Conditions</a>.</label>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './src/lib/supabase.js';

        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('message');
        const refInput = document.getElementById('referralCode');

        // 1. Referral Code Detection
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');
            if (refCode) {
                refInput.value = refCode.toUpperCase().trim();
            }
        });

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = type === 'error' ? 'msg-error' : (type === 'warning' ? 'msg-warning' : 'msg-success');
        }

        // 2. Registration Logic
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referralCode = refInput.value.toUpperCase().trim();
            const termsChecked = document.getElementById('terms').checked;

            // Simple Validations
            if (password !== confirmPassword) {
                return showMessage("Passwords do not match.", "error");
            }

            if (!termsChecked) {
                return showMessage("You must agree to the terms.", "error");
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";
            messageBox.style.display = 'none';

            try {
                // Step A0: Resolve referral code -> referrer's profile UUID.
                //
                // IMPORTANT: `profiles.referred_by` is a `uuid` column that
                // references `profiles.id` — NOT the raw referral code string.
                //
                // We can't just do a direct `.from('profiles').select().eq('referral_code', ...)`
                // here, because RLS on `profiles` only allows a user to see
                // their own row (or their downline). An unauthenticated user
                // signing up can't see the referrer's row that way, so a
                // direct select silently returns zero rows.
                //
                // Instead we call a SECURITY DEFINER Postgres function
                // (`get_referrer_id`) that runs with elevated privileges and
                // returns ONLY the matching id — nothing else about that
                // profile is exposed. See the accompanying SQL migration.
                let referrerId = null;
                let referralWarning = null;

                if (referralCode) {
                    const { data: resolvedReferrerId, error: rpcError } = await supabase
                        .rpc('get_referrer_id', { code: referralCode });

                    if (resolvedReferrerId) {
                        referrerId = resolvedReferrerId;
                    } else {
                        // DEBUG MODE: surface the actual RPC error on-screen
                        // (instead of just console.warn) so it's visible on
                        // mobile without dev tools. Revert to the quieter
                        // console-only version once the root cause is found.
                        referralWarning = rpcError
                            ? `Referral lookup failed: ${rpcError.message}`
                            : "Referral code not recognized — continuing without it.";
                    }
                }

                // Step A: Supabase Auth Sign Up
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    // Step B: Create the profile record
                    // Note: In Step 4 (SQL), we will set up triggers/tables.
                    // This logic assumes the profile table is ready to accept the insert.
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            {
                                id: data.user.id,
                                full_name: fullName,
                                email: email,
                                phone: phone,
                                referred_by: referrerId, // UUID of referrer's profile, or null
                                wallet_balance: 0 // Initialize at zero; bonus logic will be handled server-side
                            }
                        ]);

                    if (profileError) {
                        // If profile creation fails, we still have the Auth user.
                        // Log for admin or handle cleanup.
                        console.error("Profile Error:", profileError.message);
                    }

                    if (referralWarning) {
                        showMessage(`Registration successful! ${referralWarning} Redirecting...`, "warning");
                    } else {
                        showMessage("Registration successful! Redirecting...", "success");
                    }

                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }

            } catch (err) {
                showMessage(err.message || "An error occurred during registration.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
