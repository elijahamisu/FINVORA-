<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FINVORA — Premium Investment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030508;
            --bg-navy: #050a14;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #B8860B 0%, #D4AF37 50%, #FFD700 100%);
            --text-white: #ffffff;
            --text-gray: #a0aec0;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.2);
            --error: #ff4d4d;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #001a33, transparent);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--bg-navy);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area a {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold-primary);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 15px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin: 20px 0;
        }

        .checkbox-group a {
            color: var(--gold-primary);
            text-decoration: none;
        }

        .btn-register {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .footer-text a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
        }

        #message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 77, 77, 0.2);
            display: block !important;
        }

        .msg-success {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--glass-border);
            display: block !important;
        }

        .msg-warning {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-primary);
            border: 1px solid var(--glass-border);
            display: block !important;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-area">
            <a href="index.html">FINVORA</a>
            <p style="font-size: 0.75rem; color: var(--text-gray); letter-spacing: 1px; margin-top: 5px;">CREATE ACCOUNT</p>
        </div>

        <div id="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="08012345678" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <input type="text" id="referralCode" class="form-control" placeholder="ABC123">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the FINVORA <a href="terms.html">Terms & Conditions</a>.</label>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './src/lib/supabase.js';

        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('message');
        const refInput = document.getElementById('referralCode');

        // 1. Referral Code Detection
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');
            if (refCode) {
                refInput.value = refCode.toUpperCase().trim();
            }
        });

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = type === 'error' ? 'msg-error' : (type === 'warning' ? 'msg-warning' : 'msg-success');
        }

        // 2. Registration Logic
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referralCode = refInput.value.toUpperCase().trim();
            const termsChecked = document.getElementById('terms').checked;

            // Simple Validations
            if (password !== confirmPassword) {
                return showMessage("Passwords do not match.", "error");
            }

            if (!termsChecked) {
                return showMessage("You must agree to the terms.", "error");
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";
            messageBox.style.display = 'none';

            try {
                // IMPORTANT — how referrals actually get attributed:
                //
                // The database has a trigger (on_auth_user_created ->
                // handle_new_user()) that fires the instant
                // supabase.auth.signUp() creates a new auth user. That
                // trigger — not this file — is what inserts the row into
                // `profiles`. It also creates the wallet and welcome-bonus
                // transaction. It already contains its own referral
                // resolution logic:
                //
                //   referred_by = (
                //     select id from public.profiles
                //     where referral_code = new.raw_user_meta_data->>'referred_by'
                //     limit 1
                //   )
                //
                // So the ONLY thing this file needs to do is put the raw
                // referral code string into the signUp() metadata under
                // the key `referred_by`. The trigger does the
                // code -> uuid lookup itself, server-side, with elevated
                // privileges, so it isn't blocked by RLS.
                //
                // Previously this file separately looked up the referrer's
                // id itself (via an RPC call) and then INSERTed its own
                // `profiles` row after signUp(). That insert always
                // collided with the row the trigger had already created
                // (duplicate primary key on `id`) and failed silently —
                // and the referral code never reached the trigger's own
                // resolution logic in the first place, since it was never
                // included in the signUp metadata. Do NOT re-add a
                // client-side profiles insert here — it will conflict
                // with the trigger every time.

                // Step A: Supabase Auth Sign Up.
                // Pass the referral code straight through as metadata —
                // the trigger reads raw_user_meta_data->>'referred_by' and
                // resolves it to the referrer's uuid itself.
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone,
                            referred_by: referralCode || null
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    // Nothing else to do here — handle_new_user() has
                    // already created the profile row (with referred_by
                    // resolved, wallet, and welcome bonus) via the trigger.
                    showMessage("Registration successful! Redirecting...", "success");

                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }

            } catch (err) {
                showMessage(err.message || "An error occurred during registration.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
